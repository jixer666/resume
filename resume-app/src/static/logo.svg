<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="简历盒子">
  <title>简历盒子</title>
  <desc>蓝底圆角方块内，一份简历从盒子里露出，象征简历收纳与云端同步。</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#tile)"/>
  <!-- 简历纸张 -->
  <rect x="176" y="112" width="160" height="200" rx="22" fill="#ffffff"/>
  <rect x="200" y="156" width="112" height="18" rx="9" fill="#93c5fd"/>
  <rect x="200" y="198" width="80" height="18" rx="9" fill="#93c5fd"/>
  <rect x="200" y="240" width="100" height="18" rx="9" fill="#93c5fd"/>
  <!-- 盒子前挡板 -->
  <rect x="120" y="276" width="272" height="120" rx="24" fill="#dbeafe"/>
  <rect x="196" y="326" width="120" height="20" rx="10" fill="#2563eb"/>
</svg>
